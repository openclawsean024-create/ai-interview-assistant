<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #16213e;
    --accent: #667eea;
    --accent2: #764ba2;
    --text: #f0f0f5;
    --muted: #8888aa;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #eab308;
  }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(102,126,234,0.3); border-radius: 2px; }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: rgba(26,26,46,0.95);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .title { font-size: 14px; font-weight: 600; color: var(--text); }
  .subtitle { font-size: 11px; color: var(--muted); }
  .mode-tabs {
    display: flex;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    padding: 2px;
    gap: 2px;
  }
  .mode-tab {
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
  }
  .mode-tab.active { background: var(--accent); color: white; }
  .mode-tab:hover:not(.active) { color: var(--text); }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: rgba(22,33,62,0.6);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.listening { background: var(--green); animation: pulse 1.5s infinite; }
  .status-dot.error { background: var(--red); }
  .status-dot.processing { background: var(--yellow); animation: pulse 0.8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .status-text { font-size: 11px; color: var(--muted); flex: 1; }
  .mic-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.1);
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    transition: all 0.2s;
  }
  .mic-btn:hover { background: rgba(255,255,255,0.18); }
  .mic-btn.active { background: var(--green); }

  /* Main content */
  .content { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  /* Transcripts */
  .transcript-section { }
  .section-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .transcript-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.6;
    min-height: 60px;
    color: #c8c8e0;
  }
  .transcript-box.listening { border-color: rgba(34,197,94,0.3); }
  .transcript-box .interim { color: var(--muted); font-style: italic; }
  .transcript-box .final { color: var(--text); }
  .waiting-msg { color: var(--muted); font-size: 12px; text-align: center; padding: 16px 0; }

  /* Audio visualizer */
  .visualizer {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 24px;
    justify-content: center;
  }
  .viz-bar {
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    transition: height 0.05s;
    min-height: 3px;
    max-height: 24px;
  }

  /* Answer section */
  .answer-section { }
  .answer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .answer-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .answer-actions { display: flex; gap: 4px; }
  .icon-btn {
    width: 26px; height: 26px;
    border-radius: 6px;
    border: none;
    background: rgba(255,255,255,0.07);
    color: var(--muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    transition: all 0.2s;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.14); color: var(--text); }
  .icon-btn.speaking { color: var(--green); }
  .answer-box {
    background: rgba(102,126,234,0.08);
    border: 1px solid rgba(102,126,234,0.2);
    border-radius: 10px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
    min-height: 80px;
  }
  .answer-point {
    margin-bottom: 8px;
    padding-left: 10px;
    border-left: 2px solid var(--accent);
  }
  .answer-point:last-child { margin-bottom: 0; }
  .answer-loading { text-align: center; padding: 20px; color: var(--muted); font-size: 12px; }
  .answer-empty { text-align: center; padding: 20px; color: var(--muted); font-size: 12px; }
  .answer-empty .hint { font-size: 11px; margin-top: 4px; }

  /* Speed control */
  .speed-row { display: flex; gap: 4px; margin-top: 6px; align-items: center; }
  .speed-btn {
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.1);
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .speed-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .speed-btn:hover:not(.active) { color: var(--text); }

  /* TTS active sentence highlight */
  .answer-point.speaking {
    background: rgba(102,126,234,0.18);
    border-left: 3px solid #22c55e;
    border-radius: 0 4px 4px 0;
    padding-left: 9px;
  }

  /* Settings row */
  .settings-row { display: flex; gap: 8px; align-items: center; }
  .select-field {
    flex: 1;
    padding: 6px 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
  }
  .select-field option { background: var(--surface); }

  /* TTS new answer prompt */
  .tts-prompt {
    display: none;
    background: rgba(234,179,8,0.1);
    border: 1px solid rgba(234,179,8,0.3);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    color: #eab308;
    text-align: center;
    animation: fadeIn 0.3s;
  }
  .tts-prompt.show { display: block; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
  .tts-prompt-btns { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
  .tts-prompt-btn {
    padding: 4px 12px;
    border-radius: 6px;
    border: none;
    font-size: 11px;
    cursor: pointer;
    font-weight: 600;
  }
  .tts-prompt-btn.yes { background: #eab308; color: #000; }
  .tts-prompt-btn.no { background: rgba(255,255,255,0.08); color: var(--muted); }

  /* Practice mode */
  .practice-panel { display: none; flex-direction: column; gap: 12px; }
  .practice-panel.show { display: flex; }
  .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .category-btn {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .category-btn:hover, .category-btn.active { background: rgba(102,126,234,0.2); border-color: var(--accent); }
  .practice-question {
    background: rgba(102,126,234,0.1);
    border: 1px solid rgba(102,126,234,0.25);
    border-radius: 10px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
  }
  .practice-timer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px;
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .practice-timer.warning { color: var(--yellow); }
  .practice-timer.danger { color: var(--red); animation: pulse 0.5s infinite; }
  .timer-controls { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
  .timer-btn {
    padding: 6px 16px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.06);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
  }
  .timer-btn:hover { background: rgba(255,255,255,0.12); }
  .timer-btn.primary { background: var(--accent); border-color: var(--accent); }

  /* Footer */
  .footer {
    padding: 8px 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .shortcut-hint { font-size: 10px; color: var(--muted); }
  .shortcut-hint kbd {
    background: rgba(255,255,255,0.1);
    padding: 1px 5px;
    border-radius: 3px;
    font-family: monospace;
  }
  .footer-link { font-size: 10px; color: var(--muted); text-decoration: none; }
  .footer-link:hover { color: var(--accent); }

  /* API Key warning */
  .api-warning {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px;
    padding: 10px;
    font-size: 11px;
    color: #fca5a5;
    display: none;
    animation: fadeIn 0.3s;
  }
  .api-warning.show { display: block; }

  /* Responsive narrow */
  @media (max-width: 400px) {
    .mode-tabs { display: none; }
    .category-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="logo">🤖</div>
    <div>
      <div class="title">AI 面試助理</div>
      <div class="subtitle">v4.0 — Chrome Extension</div>
    </div>
  </div>
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="interview">面試模式</button>
    <button class="mode-tab" data-mode="practice">練習模式</button>
  </div>
</div>

<!-- Status bar -->
<div class="status-bar">
  <div class="status-dot" id="statusDot"></div>
  <span class="status-text" id="statusText">待機中</span>
  <div class="visualizer" id="visualizer" style="display:none">
    <div class="viz-bar" style="height:4px"></div>
    <div class="viz-bar" style="height:6px"></div>
    <div class="viz-bar" style="height:8px"></div>
    <div class="viz-bar" style="height:6px"></div>
    <div class="viz-bar" style="height:4px"></div>
  </div>
  <button class="mic-btn" id="micToggle" title="切換聆聽">🎤</button>
</div>

<!-- API Warning -->
<div class="api-warning" id="apiWarning">
  ⚠️ 尚未設定 API Key，請至 <a href="/settings" style="color:#60A5FA" target="_blank">設定頁面</a> 設定
</div>

<!-- Main Content -->
<div class="content" id="mainContent">

  <!-- INTERVIEW MODE -->
  <div id="interviewPanel">
    <!-- Transcript -->
    <div class="transcript-section">
      <div class="section-label">麥克風辨識</div>
      <div class="transcript-box" id="transcriptBox">
        <div class="waiting-msg">等待面試官提問中...</div>
      </div>
    </div>

    <!-- Answer -->
    <div class="answer-section">
      <div class="answer-header">
        <span class="answer-label">✨ AI 答案建議</span>
        <div class="answer-actions">
          <button class="icon-btn" id="copyAnswerBtn" title="複製答案">📋</button>
          <button class="icon-btn" id="ttsBtn" title="朗讀答案">🔊</button>
          <button class="icon-btn" id="stopTtsBtn" title="停止朗讀" style="display:none">⏹</button>
          <button class="icon-btn" id="cancelAnswerBtn" title="取消生成" style="display:none">✕</button>
        </div>
      </div>
      <div class="answer-box" id="answerBox">
        <div class="answer-empty">
          開始聆聽後，AI 會在 3 秒內生成答案建議<br>
          <span class="hint">⚡ Alt+Shift+M 快速開關聆聽</span>
        </div>
      </div>
      <div class="speed-row" id="speedRow" style="display:none">
        <span style="font-size:11px;color:var(--muted)">速度:</span>
        <button class="speed-btn" data-speed="0.75">0.75x</button>
        <button class="speed-btn active" data-speed="1.0">1.0x</button>
        <button class="speed-btn" data-speed="1.25">1.25x</button>
        <button class="speed-btn" data-speed="1.5">1.5x</button>
      </div>
    </div>

    <!-- Settings -->
    <div class="settings-row">
      <select class="select-field" id="micSelect">
        <option value="">🎤 載入麥克風中...</option>
      </select>
    </div>
    <div class="settings-row">
      <select class="select-field" id="modelSelect">
        <option value="gpt-4o">GPT-4o</option>
        <option value="gpt-4o-mini">GPT-4o-mini</option>
        <option value="gpt-4-turbo">GPT-4 Turbo</option>
      </select>
      <select class="select-field" id="langSelect">
        <option value="en-US">English</option>
        <option value="zh-TW">繁體中文</option>
        <option value="ja-JP">日本語</option>
      </select>
    </div>

    <!-- TTS Prompt -->
    <div class="tts-prompt" id="ttsPrompt">
      <span>✨ 新答案已生成，要朗讀嗎？</span>
      <div class="tts-prompt-btns">
        <button class="tts-prompt-btn yes" id="ttsYesBtn">是，朗讀</button>
        <button class="tts-prompt-btn no" id="ttsNoBtn">不了</button>
      </div>
    </div>
  </div>

  <!-- PRACTICE MODE -->
  <div class="practice-panel" id="practicePanel">
    <div>
      <div class="section-label">選擇題庫分類</div>
      <div class="category-grid" id="categoryGrid">
        <button class="category-btn active" data-cat="javascript">JavaScript</button>
        <button class="category-btn" data-cat="react">React</button>
        <button class="category-btn" data-cat="system-design">系統設計</button>
        <button class="category-btn" data-cat="behavioral">行為面試</button>
      </div>
    </div>

    <div>
      <div style="display:flex;gap:6px">
        <button class="btn primary" style="flex:1;padding:8px;background:var(--accent);border:none;border-radius:8px;color:white;font-size:13px;cursor:pointer" id="randomQBtn">🎲 隨機題目</button>
        <button class="btn" style="flex:1;padding:8px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:var(--text);font-size:13px;cursor:pointer" id="genAnswerBtn">✨ 生成答案</button>
      </div>
    </div>

    <div class="practice-question" id="practiceQuestion">
      <div style="text-align:center;color:var(--muted);font-size:12px">
        點擊「隨機題目」開始練習
      </div>
    </div>

    <div>
      <div class="section-label">計時器</div>
      <div class="practice-timer" id="practiceTimer">02:00</div>
      <div class="timer-controls">
        <button class="timer-btn primary" id="startTimerBtn">▶ 開始</button>
        <button class="timer-btn" id="resetTimerBtn">↺ 重置</button>
      </div>
      <div style="display:flex;gap:6px;margin-top:6px;justify-content:center">
        <button class="timer-btn" id="set1Btn">1 分鐘</button>
        <button class="timer-btn primary" id="set2Btn">2 分鐘</button>
        <button class="timer-btn" id="set5Btn">5 分鐘</button>
      </div>
    </div>

    <div id="practiceAnswer" style="display:none">
      <div class="section-label">✨ AI 答案</div>
      <div class="answer-box" id="practiceAnswerBox"></div>
    </div>
  </div>

</div>

<!-- Footer -->
<div class="footer">
  <span class="shortcut-hint"><kbd>Alt+Shift+M</kbd> 切換聆聽</span>
  <a href="/settings" class="footer-link" target="_blank">⚙ 設定</a>
</div>

<script src="sidePanel.js"></script>
</body>
</html>
