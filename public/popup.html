<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 360px;
    min-height: 520px;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 60%, #16213e 100%);
    color: #f0f0f5;
    padding: 18px 18px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .logo {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .title h1 { font-size: 16px; font-weight: 700; color: #fff; }
  .title p { font-size: 11px; color: #6b7280; margin-top: 1px; }
  .version-badge {
    margin-left: auto;
    background: rgba(102,126,234,0.2);
    color: #667eea;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: 600;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.07);
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #6b7280;
    flex-shrink: 0;
    transition: all 0.3s;
  }
  .status-dot.listening { background: #22c55e; animation: pulse 1.5s infinite; }
  .status-dot.error { background: #ef4444; }
  .status-dot.processing { background: #eab308; animation: pulse 0.8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .status-text { font-size: 12px; color: #9ca3af; flex: 1; }
  .platform-tag {
    font-size: 11px;
    color: #667eea;
    background: rgba(102,126,234,0.12);
    padding: 2px 7px;
    border-radius: 6px;
  }

  /* Buttons */
  .btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(102,126,234,0.4); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary.listening {
    background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
    box-shadow: 0 4px 16px rgba(34,197,94,0.3);
  }
  .btn-secondary {
    background: rgba(255,255,255,0.07);
    color: #e5e7eb;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.12); }
  .btn-danger {
    background: rgba(239,68,68,0.15);
    color: #fca5a5;
    border: 1px solid rgba(239,68,68,0.2);
  }
  .btn-danger:hover { background: rgba(239,68,68,0.25); }

  /* API Key warning */
  .api-warning {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.25);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 11px;
    color: #fca5a5;
    display: none;
  }
  .api-warning.show { display: block; }
  .api-warning a { color: #60A5FA; text-decoration: none; }

  /* Selects */
  .select-row { display: flex; gap: 8px; }
  .select-field {
    flex: 1;
    padding: 8px 10px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #e5e7eb;
    font-size: 12px;
    cursor: pointer;
  }
  .select-field option { background: #1a1a2e; }

  /* Shortcuts */
  .shortcuts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .shortcut {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    padding: 8px;
    border-radius: 8px;
    text-align: center;
  }
  .shortcut kbd {
    display: inline-block;
    padding: 2px 7px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    font-size: 11px;
    font-family: monospace;
    color: #e5e7eb;
    letter-spacing: 0.5px;
  }
  .shortcut span { display: block; font-size: 10px; color: #6b7280; margin-top: 3px; }

  /* History */
  .history-panel {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    padding: 10px;
    max-height: 140px;
    overflow-y: auto;
    font-size: 12px;
  }
  .history-item {
    padding: 7px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .history-item:last-child { border-bottom: none; }
  .history-q { color: #a5b4fc; font-weight: 600; margin-bottom: 3px; }
  .history-a { color: #9ca3af; line-height: 1.4; }
  .history-time { color: #6b7280; font-size: 10px; margin-top: 4px; }
  .history-empty { color: #6b7280; font-size: 12px; text-align: center; padding: 16px 0; }

  /* Footer */
  .footer {
    text-align: center;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 10px;
    color: #4b5563;
  }
  .footer a { color: #6b7280; text-decoration: none; }
  .footer a:hover { color: #667eea; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: rgba(102,126,234,0.3); border-radius: 2px; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">🤖</div>
  <div class="title">
    <h1>AI 面試助理</h1>
    <p>即時答案建議</p>
  </div>
  <span class="version-badge">v4.0</span>
</div>

<!-- Status bar -->
<div class="status-bar">
  <div class="status-dot" id="statusDot"></div>
  <span class="status-text" id="statusText">待機中</span>
  <span class="platform-tag" id="platformTag" style="display:none">-</span>
</div>

<!-- API Warning -->
<div class="api-warning" id="apiWarning">
  ⚠️ 尚未設定 API Key — <a href="/settings" target="_blank">前往設定</a>
</div>

<!-- SidePanel / Interview Mode Button -->
<div>
  <button class="btn btn-primary" id="openSidePanelBtn">
    <span id="sidePanelBtnIcon">🔍</span>
    <span id="sidePanelBtnText">開啟面試模式</span>
  </button>
</div>

<!-- Listening Toggle -->
<div>
  <button class="btn btn-secondary" id="toggleListeningBtn">
    <span id="toggleIcon">🎤</span>
    <span id="toggleText">開始聆聽</span>
  </button>
</div>

<!-- Settings Row -->
<div class="select-row">
  <select class="select-field" id="modelSelect">
    <option value="gpt-4o">GPT-4o</option>
    <option value="gpt-4o-mini">GPT-4o-mini</option>
    <option value="gpt-4-turbo">GPT-4 Turbo</option>
  </select>
  <select class="select-field" id="langSelect">
    <option value="en-US">English</option>
    <option value="zh-TW">繁體中文</option>
    <option value="ja-JP">日本語</option>
  </select>
</div>

<!-- Shortcuts -->
<div>
  <div class="shortcuts">
    <div class="shortcut">
      <kbd>Alt+Shift+M</kbd>
      <span>切換聆聽</span>
    </div>
    <div class="shortcut">
      <kbd>點擊插件圖示</kbd>
      <span>開啟側邊欄</span>
    </div>
  </div>
</div>

<!-- History -->
<div>
  <div style="font-size:10px;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">最近問答</div>
  <div class="history-panel" id="historyPanel">
    <div class="history-empty">尚無歷史記錄</div>
  </div>
</div>

<!-- Footer -->
<div class="footer">
  <a href="/settings" target="_blank">⚙ 設定</a>
  &nbsp;·&nbsp;
  AI Interview Assistant v4.0
</div>

<script src="popup.js"></script>
</body>
</html>
