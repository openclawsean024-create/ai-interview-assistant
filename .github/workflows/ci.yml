name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit / contract tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      - name: Extension files must not ship with the web app (AC-007)
        run: |
          if git ls-files public | grep -E "manifest.json|sidePanel|content.js|background.js|popup"; then
            echo "Chrome extension files found under public/" && exit 1
          fi

      - name: No direct AI endpoint in API routes (AC-002)
        run: |
          if grep -rn "api.openai.com" app/api; then
            echo "External AI endpoint referenced inside app/api" && exit 1
          fi

      - name: Credential scan (AC-010)
        run: bash scripts/check-credentials.sh --history

      - name: Whitespace check (AC-010)
        run: git diff --check origin/master...HEAD

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
